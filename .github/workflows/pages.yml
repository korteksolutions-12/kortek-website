name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  mode: cancel

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      node_version: ${{ steps.node.outputs.version }}
    steps:
      - name: Setup Node.js
        id: node
        run: |
          echo "version=$(node -e 'console.log(require(\'./package.json\').devDependencies.node || \'16\')')" >> $GITHUB_OUTPUT
          echo "version=$(node -v)" >> $GITHUB_OUTPUT

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}