---
# MR DEVELOPER Agent Configuration
# KSwds Phase 2: Website Production Agent

agent:
  name: "MR DEVELOPER"
  id: "mr-developer"
  role: "website-delivery-agent"
  capabilities:
    - blueprint-reading
    - template-rendering
    - component-generation
    - qa-execution
    - deployment-prep

blueprint:
  inputs:
    - blueprint-json
    - tier-config
    - media-requirements
  validations:
    - all-required-pages
    - tier-features-match
    - media-assets-present

generation:
  templateDir: ".kswds/templates"
  outputDir: "dist"
  fileStructure:
    - index.html
    - about.html
    - services.html
    - projects.html
    - contact.html
    - css/style.css
    - css/components.css
    - js/main.js
    - js/navigation.js
    - js/form-validation.js
    - assets/images/
    - assets/icons/

qaGate:
  jobs:
    - lint
    - link-checking
    - image-checking
    - accessibility
    - responsive
    - visual
    - performance
  allMustPass: true
  onFail:
    action: "halt-and-report"
    notification: "Founder"

deployment:
  staging:
    url: "https://staging.kortek.co.ke/{projectId}"
    provider: "github-pages"
  production:
    url: "https://{projectName}.kortek.co.ke"
    provider: "chosen-by-client"

reporting:
  progress: every-25-percent
  summary: on-completion
  qa-results: included
---